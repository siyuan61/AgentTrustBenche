[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrustbench"
version = "0.1.0"
description = "A deterministic MVP for testing and supervising tool-using agents"
requires-python = ">=3.11"

[project.scripts]
atb = "atb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["atb*"]
